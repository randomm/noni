name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Install dev dependencies
        run: python -m pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
