[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noni"
dynamic = ["version"]
description = "Attachable product-direction layer: steering ledger, backlog ordering, session claims, census"
requires-python = ">=3.11"
dependencies = []

# The versions are pinned exactly, and .github/workflows/ci.yml installs the
# same pins: the gate a developer runs locally must be the gate CI runs.
# tests/test_gate_wiring.py asserts the two lists stay identical.
[project.optional-dependencies]
dev = [
    "build==1.4.0",
    "coverage==7.17.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

# src layout: the package is src/noni/, so it never collides with an attached
# project's own noni/ state directory (which is data, never code). Only the
# package ships: skills/, scripts/, tests/ and integrations/ stay out of the
# wheel, pinned by tests/test_wheel_contents.py.
[tool.setuptools.packages.find]
where = ["src"]

# One owner for the version: the wheel's metadata is read from
# ``noni.__version__``, so a release bumps one line and the distribution cannot
# disagree with the package.
[tool.setuptools.dynamic]
version = { attr = "noni.__version__" }

# One console command, one subcommand per tool (census, register, claim, decide,
# order). The dispatch module holds no behaviour of its own.
[project.scripts]
noni = "noni.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["noni/decisions"]

[tool.ruff.lint]
# RUF100 makes an unused suppression a failure, so a `# noqa` that stopped
# suppressing anything is deleted rather than left to rot (AGENTS.md,
# Suppressions). E402 and F401 are named in the select alongside the letter
# groups so a `# noqa: E402` or `# noqa: F401` that stops suppressing a real
# finding is caught too: naming the rules changes no verdict on this tree
# (they report nothing today, with the surviving suppressions in place), it
# only makes a stale suppression on those two rules visible.
select = ["E", "F", "W", "I", "B", "E402", "F401", "RUF100"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The quality gate behind the AGENTS.md rule of at least 80 percent coverage
# for new code. `include` names the product modules exactly (the package
# modules under src/noni/ plus the two integration modules), so the total is
# the coverage of the shipped code and never of the tests that measure it.
# tests/_harness.py PRODUCT_MODULES is the list this one is compared against,
# and tests/test_gate_wiring.py asserts the two agree and that each named file
# exists. The skills/*/scripts/ wrappers are deliberately absent: they are thin
# shims over the package, and measuring them would measure the import line
# twice.
#
# `patch = ["subprocess"]` plus `parallel = true` are what make the gate
# honest: register.py, claim.py and census-sessions.py are reached only as
# subprocesses, so without subprocess measurement their files would be read
# but never executed. `relative_files` keeps the combined data portable, so
# `coverage combine` finds the subprocess files written by the launched
# interpreters whatever their working directory.
#
# The gate command: coverage run -m pytest && coverage combine && coverage report
[tool.coverage.run]
relative_files = true
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
fail_under = 80
skip_empty = true
include = [
    "integrations/adapter_protocol.py",
    "integrations/github-issues/github_issues_adapter.py",
    "src/noni/_session_git.py",
    "src/noni/_session_fields.py",
    "src/noni/_session_body.py",
    "src/noni/_path_kind.py",
    "src/noni/_safe_text.py",
    "src/noni/_session_guard.py",
    "src/noni/_session_paths.py",
    "src/noni/_session_rebase_state.py",
    "src/noni/_commit_cause.py",
    "src/noni/_marker.py",
    "src/noni/_session_push.py",
    "src/noni/_decide_flags.py",
    "src/noni/close.py",
    "src/noni/release.py",
    "src/noni/census.py",
    "src/noni/census_git.py",
    "src/noni/census_hygiene.py",
    "src/noni/census_intent.py",
    "src/noni/census_intent_readers.py",
    "src/noni/census_json.py",
    "src/noni/census_ledger_checks.py",
    "src/noni/ledger_schema.py",
    "src/noni/_writer.py",
    "src/noni/census_ledger_edited.py",
    "src/noni/census_ledger.py",
    "src/noni/census_ordering.py",
    "src/noni/census_ordering_readers.py",
    "src/noni/census_cli.py",
    "src/noni/census_run.py",
    "src/noni/census_report.py",
    "src/noni/census_sessions.py",
    "src/noni/census_sessions_checks.py",
    "src/noni/census_sessions_probe.py",
    "src/noni/census_text.py",
