[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noni"
version = "0.1.0"
description = "Attachable product-direction layer: steering ledger, backlog ordering, session claims, census"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

# Flat layout (dashboard, desktop, skills, scripts, tests): name the backend
# package explicitly so setuptools does not refuse auto-discovery.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["skills", "noni/decisions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
